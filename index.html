<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weather App</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center p-5">

  <div class="w-full max-w-md">

    <h1 class="text-4xl font-bold text-white text-center mb-6">
      🌤️ Weather App
    </h1>

    <div class="bg-white rounded-2xl shadow-xl p-6">

      <div class="flex gap-2 mb-6">

        <input type="text" id="cityInput" placeholder="Enter city name"
          class="flex-1 px-4 py-3 border border-gray-300 placeholder:text-gray-400 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">

        <button id="searchBtn" class="px-5 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
          Search
        </button>

      </div>

      <p id="errorMessage" class="hidden text-red-500 text-center mb-4">
        City not found. Please try again.
      </p>

      <div id="weatherCard" class="hidden text-center">

        <h2 id="cityName" class="text-2xl font-bold text-gray-800">
          City
        </h2>

        <p id="temperature" class="text-5xl font-bold text-blue-600 my-4">
          25°C
        </p>

        <p id="condition" class="text-xl text-gray-600 mb-6">
          Clear
        </p>

        <div class="grid grid-cols-2 gap-4">

          <div class="bg-gray-100 rounded-lg p-4">
            <p class="text-gray-500 text-sm">
              💧 Humidity
            </p>

            <p id="humidity" class="text-lg font-semibold text-gray-800">
              60%
            </p>
          </div>

          <div class="bg-gray-100 rounded-lg p-4">
            <p class="text-gray-500 text-sm">
              💨 Wind Speed
            </p>

            <p id="windSpeed" class="text-lg font-semibold text-gray-800">
              10 km/h
            </p>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>

</body>

</html>
